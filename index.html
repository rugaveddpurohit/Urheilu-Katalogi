<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urheilujoukkueet Katalogi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🏆 Urheilujoukkueet Katalogi</h1>
    </header>

    <main>
      <!-- Form to Add New Team -->
      <section class="form-container">
        <h2>Lisää uusi joukkue (Add New Team)</h2>
        <form id="teamForm">
          <input
            type="text"
            id="teamName"
            placeholder="Joukkueen nimi (Team Name)"
            required
          />
          <input
            type="text"
            id="teamSport"
            placeholder="Laji (Sport)"
            required
          />
          <input
            type="text"
            id="teamCity"
            placeholder="Kaupunki (City)"
            required
          />
          <button type="submit">Lisää joukkue</button>
        </form>
      </section>

      <!-- Sorting Options -->
      <section class="controls">
        <label for="sortSelect">Lajittele (Sort by): </label>
        <select id="sortSelect">
          <option value="name">Nimi (A-Z)</option>
          <option value="sport">Laji (Sport)</option>
        </select>
      </section>

      <!-- Team Cards Grid -->
      <section id="teamList" class="team-grid">
        <!-- Teams will be dynamically generated here -->
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
