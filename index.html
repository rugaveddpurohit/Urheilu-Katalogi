<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamGear Pro - Urheilujoukkueiden Kokoelma</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
    <header class="luxury-navbar">
        <div class="logo-box">
            <a href="#etusivu" class="logo-link">
                <i class="fa-solid fa-shield-halved logo-icon"></i>
                <span class="logo-text">TEAMGEAR <span>PRO</span></span>
            </a>
        </div>
        <nav class="nav-links">
            <button class="nav-btn active" data-tab="tab-etusivu"><i class="fa-solid fa-grid-2"></i>Etusivu</button>
            <button class="nav-btn" data-tab="tab-verkkokauppa"><i
                    class="fa-solid fa-basket-shopping"></i>Verkkokauppa</button>
            <button class="nav-btn disabled" data-tab="tab-terveys"><i
                    class="fa-solid fa-heart-pulse"></i>Terveydenseuranta</button>
            <button class="nav-btn disabled" data-tab="tab-teknologia"><i class="fa-solid fa-microchip"></i>Teknologian
                edut</button>
            <button class="nav-btn disabled" data-tab="tab-yhteytta"><i class="fa-solid fa-headset"></i>Ota
                yhteyttä</button>
        </nav>
        <div class="nav-cart-box">
            <button id="open-cart-btn" class="glow-cart-btn">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-label">Kori</span>
                <span id="cart-badge" class="badge">0</span>
            </button>
        </div>
    </header>
</body>

</html>
